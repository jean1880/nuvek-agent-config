name: Feature request
description: Suggest a new generic skill, agent or a change to the template.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Start from the problem you are trying to solve. Skills here stay generic: nothing that names one person's machines or services.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues and found no request for this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What you would like
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you work on it?
      options:
        - "Yes, I would open a pull request"
        - Maybe, with some guidance
        - "No"
