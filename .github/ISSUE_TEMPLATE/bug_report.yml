name: Bug report
description: A skill, rule, agent or sync source is wrong, or fails to render.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Security problems go through [private vulnerability reporting](https://github.com/jean1880/nuvek-agent-config/security/advisories/new), not here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I searched the open and closed issues and found no report of this.
          required: true
        - label: I removed secrets, hostnames and private paths from what I paste below.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the file involved and any `agent-sync check` output.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: dropdown
    id: tools
    attributes:
      label: Agent tools involved
      multiple: true
      options:
        - Claude Code
        - Antigravity (agy)
        - Codex

  - type: input
    id: sync-version
    attributes:
      label: agent-sync version
      description: Output of `agent-sync --version`.
